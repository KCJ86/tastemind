<!doctype html>

<!-- Author: Kennedy Castillon Jimenez-->

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>TasteMind — Your AI Dining Concierge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/styles.css" />
    <!-- Applies the saved theme before the page paints (no flash) -->
    <script src="/js/theme.js"></script>
  </head>
  <body>
    <!-- HEADER -->
    <header class="topbar steel">
      <div class="topbar-inner">
        <a class="wordmark" href="/">TasteMind</a>
        <div class="topbar-actions">
          <button class="icon-btn theme-btn" id="theme-btn" aria-label="Theme"></button>
          <div class="topbar-right" id="header-right"></div>
        </div>
      </div>
    </header>

    <!-- ONBOARDING SCREEN -->
    <div class="screen active" id="screen-onboard">
      <section class="onboard">
        <h1 class="onboard-title">
          Tell it what you're craving. <strong>It finds the place.</strong>
        </h1>
        <p class="onboard-sub">
          TasteMind learns from every meal you rate, so each recommendation
          fits you a little better than the last.
        </p>

        <div class="panel onboard-panel steel">
          <div class="field-group">
            <label class="visually-hidden" for="new-name">First name</label>
            <input
              class="field"
              type="text"
              id="new-name"
              placeholder="First name"
              autocomplete="given-name"
            />
            <label class="visually-hidden" for="new-location">City</label>
            <input
              class="field"
              type="text"
              id="new-location"
              placeholder="City, e.g. San Jose"
              autocomplete="address-level2"
            />
          </div>
          <button class="btn btn-primary btn-block" id="create-user-btn">
            Create my taste profile
          </button>

          <div class="separator"><span>Already have a code?</span></div>

          <div class="inline-form">
            <label class="visually-hidden" for="returning-code">Your code</label>
            <input
              class="field"
              type="text"
              id="returning-code"
              placeholder="Your code"
              autocomplete="off"
            />
            <button class="btn btn-secondary" id="load-user-btn">Sign in</button>
          </div>
        </div>
      </section>
    </div>

    <!-- MAIN APP SCREEN -->
    <div class="screen" id="screen-app">
      <section class="search" id="search">
        <p class="greeting" id="greeting"></p>
        <h1 class="search-title">What are you <strong>craving?</strong></h1>

        <div class="search-bar steel">
          <label class="visually-hidden" for="craving-input"
            >Describe your craving</label
          >
          <input
            type="text"
            id="craving-input"
            placeholder="Something warm and brothy, not too heavy"
            autocomplete="off"
          />
          <button class="search-go" id="ask-btn">Fire it</button>
        </div>

        <div class="chips" aria-label="Suggestions">
          <button class="chip" data-craving="Something warm and cozy">
            Something warm
          </button>
          <button class="chip" data-craving="A quick, casual lunch nearby">
            Quick lunch
          </button>
          <button class="chip" data-craving="Somewhere nice for a date night">
            Date night
          </button>
          <button
            class="chip"
            data-craving="A cuisine I've never tried before"
          >
            Something new
          </button>
        </div>

        <div class="search-meta">
          <div class="location-display" id="location-display">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z" />
              <circle cx="12" cy="9.5" r="2.5" />
            </svg>
            <span id="location-text">Loading…</span>
            <button class="link-btn" id="location-edit-btn">Change</button>
          </div>

          <div class="radius">
            <label for="radius-slider">Within</label>
            <input
              type="range"
              id="radius-slider"
              min="1"
              max="50"
              value="10"
              step="1"
            />
            <span id="radius-value">10 miles</span>
          </div>
        </div>

        <!-- Budget: none selected means any price. Pick one or several. -->
        <div class="budget" role="group" aria-labelledby="budget-label">
          <span class="budget-label" id="budget-label">Budget</span>
          <button class="budget-btn" data-level="0" aria-pressed="true">Any</button>
          <button class="budget-btn" data-level="1" aria-pressed="false" aria-label="Inexpensive">$</button>
          <button class="budget-btn" data-level="2" aria-pressed="false" aria-label="Moderate">$$</button>
          <button class="budget-btn" data-level="3" aria-pressed="false" aria-label="Expensive">$$$</button>
          <button class="budget-btn" data-level="4" aria-pressed="false" aria-label="Very expensive">$$$$</button>
        </div>

        <div class="location-edit" id="location-edit" style="display: none">
          <label class="visually-hidden" for="location-input">New location</label>
          <input
            class="field"
            type="text"
            id="location-input"
            placeholder="City and state, e.g. Chicago, IL"
          />
          <p
            class="location-resolved"
            id="location-resolved"
            style="display: none"
          ></p>
          <div class="location-actions">
            <button class="btn btn-secondary" id="location-cancel-btn">
              Cancel
            </button>
            <button class="btn btn-primary" id="location-save-btn">
              Update location
            </button>
          </div>
        </div>
      </section>

      <div class="container" id="review-prompt"></div>
      <main class="container results" id="main-content"></main>
    </div>

    <!-- YOUR MEALS DRAWER -->
    <div class="drawer-scrim" id="drawer-scrim" hidden></div>
    <aside
      class="drawer"
      id="drawer"
      aria-label="Your meals"
      aria-hidden="true"
    >
      <div class="drawer-head">
        <h2>Your meals</h2>
        <button class="icon-btn" id="drawer-close" aria-label="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18" />
          </svg>
        </button>
      </div>

      <section class="drawer-section" id="pending-section" style="display: none">
        <h3>Waiting for your review</h3>
        <div class="list" id="pending-list"></div>
      </section>

      <section class="drawer-section">
        <h3>Your palate</h3>
        <div class="tags" id="taste-tags"></div>
      </section>

      <section class="drawer-section">
        <h3>History</h3>
        <div class="list" id="history-list"></div>
      </section>
    </aside>

    <!-- MODAL & TOAST -->
    <div id="modal-container"></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <!-- SCRIPTS — order matters -->
    <script src="/js/api.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/app.js"></script>
  </body>
</html>
